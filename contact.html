<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact me through my accessible portfolio contact form.">
    <meta name="keywords" content="contact, portfolio, contact form, web development">
    <meta name="author" content="My Personal Portfolio">

    <title>Contact | My Personal Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="container">

            <a href="index.html" class="logo" aria-label="Go to portfolio home">
                My Portfolio
            </a>

            <nav aria-label="Primary navigation">

                <ul class="nav-list">

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="about.html">About</a>
                    </li>

                    <li>
                        <a href="projects.html">Projects</a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

            <button id="theme-toggle" type="button">
                Dark Mode
            </button>

        </div>

    </header>


    <main>

        <section class="content-section" aria-labelledby="contact-heading">

            <div class="container narrow">

                <p class="eyebrow">Get In Touch</p>

                <h1 id="contact-heading">
                    Contact Me
                </h1>

                <p>
                    If you would like to get in touch with me,
                    please fill out the form below.
                </p>


                <form
                    class="contact-form"
                    action="#"
                    method="post"
                    aria-label="Contact form"
                >

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            aria-describedby="email-help"
                            required
                        >

                        <small id="email-help">
                            Please enter a valid email address.
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="button"
                    >
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 My Personal Portfolio.
                All rights reserved.
            </p>

        </div>

    </footer>

    <script src="script.js"></script>

</body>

</html>
